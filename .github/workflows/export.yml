name: Export sessioni

# Pacchetto di analisi di ogni sessione (ex notebook Colab F1_export_v3) salvato in export/.
# Automatico: ogni 30 minuti nel weekend scarica le sessioni finite da almeno 35 minuti.
# A mano: Actions → Export sessioni → Run workflow (gara e sessione facoltative).

on:
  schedule:
    # Ogni 30 minuti (al minuto 10 e 40), solo domenica, lunedì, venerdì e sabato (orari UTC)
    - cron: "10,40 * * * 0,1,5,6"
  workflow_dispatch:
    inputs:
      gara:
        description: "Gara, es. Austin; più gare separate da virgola per il recupero (vuoto = weekend in corso)"
        required: false
        default: ""
      sessione:
        description: "FP1 FP2 FP3 SQ S Q R (vuoto = tutte quelle finite)"
        required: false
        default: ""
      forza:
        description: "Riscarica anche le sessioni già presenti (si/no)"
        required: false
        default: "no"

permissions:
  contents: write

concurrency:
  group: export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le librerie
        run: pip install numpy pandas requests

      - name: Scarica le sessioni da OpenF1 (e salva dopo ogni gara)
        env:
          GARA: ${{ github.event.inputs.gara }}
          SESSIONE: ${{ github.event.inputs.sessione }}
          FORZA: ${{ github.event.inputs.forza }}
        run: |
          git config user.name "muretto-bot"
          git config user.email "muretto-bot@users.noreply.github.com"
          salva() {
            if [ -n "$(git status --porcelain export)" ]; then
              git add export
              git commit -m "Export sessioni aggiornato${1:+: $1}"
              for i in 1 2 3; do
                git pull --rebase && git push && return 0
                sleep 15
              done
              return 1
            fi
            echo "Nessuna novità${1:+ per $1}."
          }
          ARGS=(--out-dir export)
          if [ -n "$SESSIONE" ]; then ARGS+=(--sessione "$SESSIONE"); fi
          if [ "$FORZA" = "si" ]; then ARGS+=(--forza); fi
          integrita() {   # completezza dell'Export di tutta la stagione (verifica_integrita.py, 5/11/2026)
            python verifica_integrita.py --anni "$(date -u +%Y)" --export --out "export/integrita-$(date -u +%Y).json" \
              --github --solo-problemi | grep -E "Export|^Sessioni" | tail -40 || true
          }
          if [ -z "$GARA" ]; then
            python export_fetch.py "${ARGS[@]}"
            integrita
            salva
            exit 0
          fi
          # una o più gare (recupero della stagione): ogni gara salvata subito, così un lancio lungo
          # interrotto dal limite di tempo non perde le gare già fatte
          IFS=',' read -ra GARE <<< "$GARA"
          for g in "${GARE[@]}"; do
            g="$(echo "$g" | xargs)"
            [ -z "$g" ] && continue
            python export_fetch.py "${ARGS[@]}" --gara "$g" || echo "::warning::$g non riuscita"
            salva "$g"
          done
          integrita
          salva "controllo di integrità"
