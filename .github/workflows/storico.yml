name: Storico

on:
  # Lanci programmati del GP di Austin 2026, in UTC: 25, 29 e 34 minuti dopo la fine prevista di ogni
  # sessione (OpenF1 libera i dati circa 30 minuti dopo: il primo lancio che li trova li salva, gli
  # altri aggiornano il file del weekend). Massimo 35 minuti, per avere i dati il prima possibile.
  # 29 e 34 invece di 30 e 35: niente lanci al minuto 00, quando GitHub è più carico e può saltarli.
  # FP1 e FP3 finiscono alle 18:30 UTC, FP2 e qualifica alle 22:00 UTC, la gara verso le 20:40 UTC.
  # Tra parentesi l'ora italiana. Lo scheduler di GitHub può partire con qualche minuto di ritardo.
  schedule:
    - cron: "55 18 23 10 *"   # FP1 +25 (ven 20:55)
    - cron: "59 18 23 10 *"   # FP1 +29 (ven 20:59)
    - cron: "4 19 23 10 *"    # FP1 +34 (ven 21:04)
    - cron: "25 22 23 10 *"   # FP2 +25 (sab 00:25)
    - cron: "29 22 23 10 *"   # FP2 +29 (sab 00:29)
    - cron: "34 22 23 10 *"   # FP2 +34 (sab 00:34)
    - cron: "55 18 24 10 *"   # FP3 +25 (sab 20:55)
    - cron: "59 18 24 10 *"   # FP3 +29 (sab 20:59)
    - cron: "4 19 24 10 *"    # FP3 +34 (sab 21:04)
    - cron: "25 22 24 10 *"   # qualifica +25 (dom 00:25)
    - cron: "29 22 24 10 *"   # qualifica +29 (dom 00:29)
    - cron: "34 22 24 10 *"   # qualifica +34 (dom 00:34)
    - cron: "5 21 25 10 *"    # gara, circa +25 (dom 22:05, ora solare)
    - cron: "9 21 25 10 *"    # gara, circa +29 (dom 22:09)
    - cron: "14 21 25 10 *"   # gara, circa +34 (dom 22:14)
  workflow_dispatch:
    inputs:
      anni:
        description: "Stagioni complete da scaricare"
        required: false
        default: "2026"
      circuito:
        description: "Circuito di cui scaricare le edizioni passate (vuoto = nessuno)"
        required: false
        default: "Austin"
      anni_circuito:
        description: "Anni delle edizioni passate del circuito"
        required: false
        default: "2023,2024,2025"
      anni_energia:
        description: "Stagioni con la telemetria dei giri (modello energia)"
        required: false
        default: "2025,2026"

permissions:
  contents: write

concurrency:
  group: storico
  cancel-in-progress: false

jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # l'archivio più recente del ramo, non quello del momento del lancio: un lancio rimasto in coda
      # deve ripartire da quello che ha salvato il lancio precedente
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scarica l'archivio da OpenF1
        timeout-minutes: 250
        env:
          ANNI: ${{ github.event.inputs.anni }}
          CIRCUITO: ${{ github.event.inputs.circuito }}
          ANNI_CIRCUITO: ${{ github.event.inputs.anni_circuito }}
          ANNI_ENERGIA: ${{ github.event.inputs.anni_energia }}
        run: python backfill_fetch.py --out-dir storico --anni "${ANNI:-2026}" --circuito "$CIRCUITO" --anni-circuito "${ANNI_CIRCUITO:-2023,2024,2025}" --anni-energia "${ANNI_ENERGIA:-2025,2026}" --max-minuti 230

      - name: Salva l'archivio
        if: always()
        run: |
          if [ -n "$(git status --porcelain storico)" ]; then
            git config user.name "muretto-bot"
            git config user.email "muretto-bot@users.noreply.github.com"
            git add storico
            git commit -m "Archivio OpenF1 per il modello"
            for i in 1 2 3; do
              git pull --rebase && git push && exit 0
              sleep 15
            done
            exit 1
          else
            echo "Nessuna novità."
          fi
