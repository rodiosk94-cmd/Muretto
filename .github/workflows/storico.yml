name: Storico

on:
  # Solo lancio a mano (Francesco, 6/11/2026: GitHub non fa partire i lanci programmati, niente più
  # schedule). Per scaricare una sessione appena finita: sessione + fine (UTC). Il lancio aspetta fino a
  # 25 minuti dopo la fine e poi riprova ogni 2 minuti finché OpenF1 non dà i dati (di solito circa
  # 30 minuti dopo la fine); per la gara riprova fino a 2 ore.
  workflow_dispatch:
    inputs:
      anni:
        description: "Stagioni complete da scaricare"
        required: false
        default: "2026"
      circuito:
        description: "Circuito di cui scaricare le edizioni passate (vuoto = nessuno)"
        required: false
        default: "Brazil"
      anni_circuito:
        description: "Anni delle edizioni passate del circuito"
        required: false
        default: "2023,2024,2025"
      anni_energia:
        description: "Stagioni con la telemetria dei giri (modello energia)"
        required: false
        default: "2025,2026"
      sessione:
        description: "Sessione da aspettare (Practice 1, Practice 2, Practice 3, Qualifying, Race); vuoto = un solo scaricamento"
        required: false
        default: ""
      fine:
        description: "Fine prevista della sessione da aspettare, in UTC (es. 2026-10-31T18:30:00Z)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: storico
  cancel-in-progress: false

jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # l'archivio più recente del ramo, non quello del momento del lancio: un lancio rimasto in coda
      # deve ripartire da quello che ha salvato il lancio precedente
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scarica l'archivio da OpenF1
        timeout-minutes: 250
        env:
          ANNI: ${{ github.event.inputs.anni }}
          CIRCUITO: ${{ github.event.inputs.circuito }}
          ANNI_CIRCUITO: ${{ github.event.inputs.anni_circuito }}
          ANNI_ENERGIA: ${{ github.event.inputs.anni_energia }}
          SESSIONE: ${{ github.event.inputs.sessione }}
          FINE_IN: ${{ github.event.inputs.fine }}
        run: |
          scarica() {
            python backfill_fetch.py --out-dir storico --anni "${ANNI:-2026}" --circuito "$CIRCUITO" \
              --anni-circuito "${ANNI_CIRCUITO:-2023,2024,2025}" --anni-energia "${ANNI_ENERGIA:-2025,2026}" \
              --max-minuti 230 || echo "::warning::scaricamento non riuscito"
          }
          # Si cerca in tutti i file della stagione la sessione con quel nome che finisce entro 6 ore dalla
          # fine prevista (il file più recente può essere ancora quello del weekend prima).
          # la sessione è in archivio e COMPLETA? (verifica_integrita.py, 5/11/2026): giri di tutti i piloti
          # uguali alla classifica, dati dall'inizio della sessione, mescole, meteo, distacchi e partenza in gara.
          # Se OpenF1 ha lacune si riprova fino al limite, poi si segnala che cosa manca.
          presente() {
            python verifica_integrita.py --anni "$(date -u -d "$2" +%Y)" --sessione "$1" --fine "$2" --esito > /tmp/integrita.txt 2>&1
          }
          SESS="$SESSIONE"; FINE="$FINE_IN"; MAXMIN=60
          if [ "$SESS" = "Race" ]; then MAXMIN=120; fi
          if [ -z "$SESS" ] || [ -z "$FINE" ]; then
            scarica
            exit 0
          fi
          if presente "$SESS" "$FINE"; then
            echo "$SESS già in archivio: niente da fare."
            exit 0
          fi
          fine=$(date -u -d "$FINE" +%s)
          inizio=$(( fine + 25 * 60 ))
          limite=$(( fine + MAXMIN * 60 ))
          ora=$(date -u +%s)
          if [ "$ora" -lt "$inizio" ]; then
            echo "Attesa fino alle $(date -u -d @$inizio +%H:%M) UTC, 25 minuti dopo la fine prevista di $SESS."
            sleep $(( inizio - ora ))
          fi
          while true; do
            scarica
            if presente "$SESS" "$FINE"; then
              echo "$SESS in archivio alle $(date -u +%H:%M) UTC."
              exit 0
            fi
            if [ "$(date -u +%s)" -ge "$limite" ]; then
              echo "::warning::$SESS non ancora completa su OpenF1: rilanciare a mano. Lacune:"
              grep "\[grave\]" /tmp/integrita.txt | sed 's/^/::warning::/' || true
              exit 0
            fi
            echo "$SESS non ancora disponibile: nuovo tentativo tra 2 minuti."
            sleep 120
          done

      - name: Controllo di integrità
        if: always()
        continue-on-error: true
        run: |
          ANNO=$(date -u +%Y)
          python verifica_integrita.py --anni "$ANNO" --out "storico/integrita-$ANNO.json" --github --solo-problemi | tail -60

      - name: Salva l'archivio
        if: always()
        run: |
          if [ -n "$(git status --porcelain storico)" ]; then
            git config user.name "muretto-bot"
            git config user.email "muretto-bot@users.noreply.github.com"
            git add storico
            git commit -m "Archivio OpenF1 per il modello"
            for i in 1 2 3; do
              git pull --rebase && git push && exit 0
              sleep 15
            done
            exit 1
          else
            echo "Nessuna novità."
          fi
