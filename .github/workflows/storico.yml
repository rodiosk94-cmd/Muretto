name: Storico

on:
  # Lanci programmati del GP di Austin 2026 (orari UTC). GitHub ritarda o salta spesso i lanci
  # programmati (il 23/10 sera anche di 25-35 minuti), quindi ogni sessione ha tre lanci PRIMA della
  # fine: il primo che parte aspetta fino a 25 minuti dopo la fine prevista e poi riprova ogni 2 minuti
  # finché OpenF1 non dà i dati della sessione (di solito circa 30 minuti dopo la fine). I lanci
  # successivi trovano la sessione già in archivio e si chiudono subito.
  # FP3 finisce alle 18:30 UTC, FP2 e qualifica alle 22:00 UTC, la gara verso le 20:40 UTC.
  schedule:
    - cron: "32 21 23 10 *"   # FP2: fine ven 22:00 UTC (sab 00:00 in Italia), dati da sab 00:25
    - cron: "41 21 23 10 *"
    - cron: "51 21 23 10 *"
    - cron: "2 18 24 10 *"    # FP3: fine sab 18:30 UTC (20:30 in Italia), dati da 20:55
    - cron: "11 18 24 10 *"
    - cron: "21 18 24 10 *"
    - cron: "32 21 24 10 *"   # qualifica: fine sab 22:00 UTC (dom 00:00 in Italia), dati da dom 00:25
    - cron: "41 21 24 10 *"
    - cron: "51 21 24 10 *"
    - cron: "12 20 25 10 *"   # gara: fine prevista dom 20:40 UTC (21:40 in Italia), dati da 22:05
    - cron: "22 20 25 10 *"
    - cron: "33 20 25 10 *"
  workflow_dispatch:
    inputs:
      anni:
        description: "Stagioni complete da scaricare"
        required: false
        default: "2026"
      circuito:
        description: "Circuito di cui scaricare le edizioni passate (vuoto = nessuno)"
        required: false
        default: "Austin"
      anni_circuito:
        description: "Anni delle edizioni passate del circuito"
        required: false
        default: "2023,2024,2025"
      anni_energia:
        description: "Stagioni con la telemetria dei giri (modello energia)"
        required: false
        default: "2025,2026"
      sessione:
        description: "Sessione da aspettare (Practice 1, Practice 2, Practice 3, Qualifying, Race); vuoto = un solo scaricamento"
        required: false
        default: ""
      fine:
        description: "Fine prevista della sessione da aspettare, in UTC (es. 2026-10-24T18:30:00Z)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: storico
  cancel-in-progress: false

jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # l'archivio più recente del ramo, non quello del momento del lancio: un lancio rimasto in coda
      # deve ripartire da quello che ha salvato il lancio precedente
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scarica l'archivio da OpenF1
        timeout-minutes: 250
        env:
          ANNI: ${{ github.event.inputs.anni }}
          CIRCUITO: ${{ github.event.inputs.circuito }}
          ANNI_CIRCUITO: ${{ github.event.inputs.anni_circuito }}
          ANNI_ENERGIA: ${{ github.event.inputs.anni_energia }}
          SESSIONE: ${{ github.event.inputs.sessione }}
          FINE_IN: ${{ github.event.inputs.fine }}
          CRON: ${{ github.event.schedule }}
        run: |
          scarica() {
            python backfill_fetch.py --out-dir storico --anni "${ANNI:-2026}" --circuito "$CIRCUITO" \
              --anni-circuito "${ANNI_CIRCUITO:-2023,2024,2025}" --anni-energia "${ANNI_ENERGIA:-2025,2026}" \
              --max-minuti 230 || echo "::warning::scaricamento non riuscito"
          }
          # la sessione è nell'archivio del weekend più recente, con giri e classifica?
          presente() {
            python -c 'import glob,gzip,json,sys; f=sorted(glob.glob("storico/2026/*.json.gz")); d=json.load(gzip.open(f[-1])) if f else {}; sys.exit(0 if any(s["session"]["session_name"]==sys.argv[1] and len(s.get("laps") or [])>0 and len(s.get("session_result") or [])>=20 for s in d.get("sessioni") or []) else 1)' "$1"
          }
          SESS="$SESSIONE"; FINE="$FINE_IN"; MAXMIN=60
          case "$CRON" in
            "32 21 23 10 *"|"41 21 23 10 *"|"51 21 23 10 *") SESS="Practice 2"; FINE="2026-10-23T22:00:00Z" ;;
            "2 18 24 10 *"|"11 18 24 10 *"|"21 18 24 10 *") SESS="Practice 3"; FINE="2026-10-24T18:30:00Z" ;;
            "32 21 24 10 *"|"41 21 24 10 *"|"51 21 24 10 *") SESS="Qualifying"; FINE="2026-10-24T22:00:00Z" ;;
            "12 20 25 10 *"|"22 20 25 10 *"|"33 20 25 10 *") SESS="Race"; FINE="2026-10-25T20:40:00Z"; MAXMIN=120 ;;
          esac
          if [ -z "$SESS" ] || [ -z "$FINE" ]; then
            scarica
            exit 0
          fi
          if presente "$SESS"; then
            echo "$SESS già in archivio: niente da fare."
            exit 0
          fi
          fine=$(date -u -d "$FINE" +%s)
          inizio=$(( fine + 25 * 60 ))
          limite=$(( fine + MAXMIN * 60 ))
          ora=$(date -u +%s)
          if [ "$ora" -lt "$inizio" ]; then
            echo "Attesa fino alle $(date -u -d @$inizio +%H:%M) UTC, 25 minuti dopo la fine prevista di $SESS."
            sleep $(( inizio - ora ))
          fi
          while true; do
            scarica
            if presente "$SESS"; then
              echo "$SESS in archivio alle $(date -u +%H:%M) UTC."
              exit 0
            fi
            if [ "$(date -u +%s)" -ge "$limite" ]; then
              echo "::warning::$SESS non ancora disponibile su OpenF1: rilanciare a mano."
              exit 0
            fi
            echo "$SESS non ancora disponibile: nuovo tentativo tra 2 minuti."
            sleep 120
          done

      - name: Salva l'archivio
        if: always()
        run: |
          if [ -n "$(git status --porcelain storico)" ]; then
            git config user.name "muretto-bot"
            git config user.email "muretto-bot@users.noreply.github.com"
            git add storico
            git commit -m "Archivio OpenF1 per il modello"
            for i in 1 2 3; do
              git pull --rebase && git push && exit 0
              sleep 15
            done
            exit 1
          else
            echo "Nessuna novità."
          fi
