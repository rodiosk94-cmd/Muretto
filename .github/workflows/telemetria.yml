name: Telemetria

on:
  schedule:
    # Ogni 30 minuti, solo domenica, lunedì, venerdì e sabato (orari UTC)
    - cron: "*/30 * * * 0,1,5,6"
    # Ogni 2 ore da martedì a giovedì: notizie e passaggio al weekend successivo
    - cron: "15 */2 * * 2,3,4"
  workflow_dispatch:
    inputs:
      session_key:
        description: "Facoltativo: session_key OpenF1 da elaborare. Vuoto = automatico"
        required: false

permissions:
  contents: write

concurrency:
  group: telemetria
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa numpy
        run: pip install numpy

      - name: Scarica la telemetria da OpenF1
        env:
          SESSION: ${{ github.event.inputs.session_key }}
        run: python openf1_fetch.py --out telemetry.json ${SESSION:+--session "$SESSION"}

      - name: Scarica le notizie
        continue-on-error: true
        run: python news_fetch.py --out news.json

      - name: Salva se ci sono novità
        run: |
          FILES="telemetry.json"
          [ -f news.json ] && FILES="$FILES news.json"
          [ -f weekend.json ] && FILES="$FILES weekend.json"
          if [ -n "$(git status --porcelain $FILES)" ]; then
            git config user.name "muretto-bot"
            git config user.email "muretto-bot@users.noreply.github.com"
            git add $FILES
            git commit -m "Telemetria e notizie aggiornate"
            # Export sessioni e Storico possono spingere nello stesso momento: riallinea e riprova
            for i in 1 2 3; do
              git pull --rebase && git push && exit 0
              sleep 15
            done
            exit 1
          else
            echo "Nessuna novità."
          fi
